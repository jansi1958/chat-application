<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chatting Applicataion</h1>
    <input id="message" type="text" placeholder="Enter your message"/>
    <button id="send" type="submit">Send</button>
    <div id="para"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const messageValue = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    const msgPara = document.getElementById("para");

    socket.on("user-meeasge", (userMessage)=>{
        const p = document.createElement("p");
        p.innerText= userMessage;
        msgPara.appendChild(p);
    })

    sendBtn.addEventListener("click", (e)=>{
        const msgValue = messageValue.value;
        console.log(msgValue);
        socket.emit("message", msgValue);
    })
</script>
</body>
</html>
